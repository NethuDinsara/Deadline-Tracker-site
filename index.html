    function initTheme() {
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.getElementById('sunIcon').classList.remove('hidden');
        document.getElementById('moonIcon').classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('sunIcon').classList.add('hidden');
        document.getElementById('moonIcon').classList.remove('hidden');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
      document.getElementById('moonIcon').classList.toggle('hidden', isDark);
    }

    // --- RENDER MODULE FILTER TABS ---
    function renderTabs() {
      const container = document.getElementById("moduleTabs");
      container.innerHTML = modules.map(m => {
        const isActive = m.id === currentModule;
        return `
          <button onclick="selectModule('${m.id}')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150 border ${
              isActive 
                ? 'bg-slate-900 text-white border-slate-900 dark:bg-indigo-600 dark:border-indigo-600 shadow-xs' 
                : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
            }">
            ${m.name}
          </button>
        `;
      }).join('');
    }

    // --- RENDER DEADLINES LIST ---
    function renderDeadlines() {
      const listEl = document.getElementById("deadlineList");
      const titleEl = document.getElementById("sectionTitle");
      const counterEl = document.getElementById("counterBadge");

      const filtered = deadlines.filter(d => currentModule === "all" || d.moduleId === currentModule);

      const activeModuleName = modules.find(m => m.id === currentModule).name;
      titleEl.textContent = currentModule === "all" ? "All Upcoming Milestones" : `${activeModuleName} Deadlines`;
      counterEl.textContent = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-dashed border-slate-300 dark:border-slate-800 text-center text-slate-500 dark:text-slate-400 text-xs">No deadlines found for this module.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const isDated = item.dateISO !== null;
        const tagColor = item.type === "Formative" 
          ? "bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800" 
          : "bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800";

        return `
          <div onclick="openDrawer('${item.id}')"
            class="group bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-slate-400 dark:hover:border-slate-600 hover:shadow-xs transition duration-150 cursor-pointer flex items-center justify-between gap-4">
            
            <div class="space-y-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${tagColor}">${item.type}</span>
                <span class="text-xs font-medium text-slate-400 dark:text-slate-500 truncate">${item.moduleName}</span>
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400">• ${item.weight}</span>
              </div>
              <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition truncate">${item.title}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${item.summary}</p>
            </div>

            <div class="text-right shrink-0">
              <p class="text-xs font-semibold ${isDated ? 'text-slate-900 dark:text-slate-200' : 'text-slate-400 dark:text-slate-500'}">${item.dateDisplay}</p>
              <span class="inline-flex items-center text-[11px] font-medium text-indigo-600 dark:text-indigo-400 group-hover:underline mt-1">
                View details
                <svg class="w-3 h-3 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </span>
            </div>

          </div>
        `;
      }).join('');
    }

    // --- DRAWER ACTIONS ---
    function openDrawer(id) {
      const item = deadlines.find(d => d.id === id);
      if (!item) return;

      document.getElementById("drawerModule").textContent = item.moduleName;
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerDate").textContent = `Due Date: ${item.dateDisplay} (${item.weight})`;

      const badge = document.getElementById("drawerBadge");
      badge.textContent = item.type;
      badge.className = `text-xs font-semibold px-2 py-0.5 rounded border ${
        item.type === "Formative" 
          ? "bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800" 
          : "bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800"
      }`;

      let bodyHTML = "";

      // Warning alert (if any)
      if (item.warning) {
        bodyHTML += `
          <div class="p-3.5 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 rounded-lg flex items-start gap-3">
            <svg class="w-4 h-4 text-red-600 dark:text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <div class="text-xs text-red-800 dark:text-red-300 leading-relaxed font-medium">
              ${item.warning}
            </div>
          </div>
        `;
      }

      // Detailed sections
      if (item.details) {
        item.details.forEach(sec => {
          bodyHTML += `
            <div class="space-y-2">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">${sec.section}</h4>
              <ul class="space-y-2">
                ${sec.items.map(bullet => `
                  <li class="flex items-start gap-2.5 text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-slate-600 mt-1.5 shrink-0"></span>
                    <span>${bullet}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        });
      }

      document.getElementById("drawerBody").innerHTML = bodyHTML;

      // Show drawer & overlay
      document.getElementById("drawerOverlay").classList.remove("hidden");
      document.getElementById("detailDrawer").classList.remove("translate-x-full");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      document.getElementById("drawerOverlay").classList.add("hidden");
      document.getElementById("detailDrawer").classList.add("translate-x-full");
      document.body.style.overflow = "auto";
    }

    function selectModule(id) {
      currentModule = id;
      renderTabs();
      renderDeadlines();
    }

    // Keyboard support for drawer closing
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    // Initialize Theme and render dashboard
    initTheme();
    renderTabs();
    renderDeadlines();
  </script>
</body>
</html>
