<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module Deadline & Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">Final Year Deadlines</h1>
        <p class="text-xs text-slate-500">Academic Year 2026/2027</p>
      </div>
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
        Active Semester
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

    <!-- Module Selector Tabs -->
    <section>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Module</label>
      <div id="moduleTabs" class="flex flex-wrap gap-2">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Deadlines List Header -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 id="sectionTitle" class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Upcoming Deadlines</h2>
        <span id="counterBadge" class="text-xs text-slate-500 font-medium"></span>
      </div>

      <!-- Deadline Cards Container -->
      <div id="deadlineList" class="space-y-3">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Slide-Over Detail Drawer -->
  <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden transition-opacity" onclick="closeDrawer()"></div>
  <aside id="detailDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[480px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-200 ease-in-out flex flex-col">
    <!-- Drawer Header -->
    <div class="p-5 border-b border-slate-200 flex items-start justify-between bg-slate-50">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span id="drawerBadge" class="text-xs font-semibold px-2 py-0.5 rounded border"></span>
          <span id="drawerModule" class="text-xs font-medium text-slate-500"></span>
        </div>
        <h3 id="drawerTitle" class="text-lg font-bold text-slate-900 leading-snug"></h3>
        <p id="drawerDate" class="text-xs font-semibold text-indigo-600 mt-1"></p>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Drawer Content (Scrollable) -->
    <div id="drawerBody" class="p-6 overflow-y-auto space-y-5 flex-1 custom-scrollbar text-sm">
      <!-- Injected via JS -->
    </div>

    <!-- Drawer Footer -->
    <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
      <button onclick="closeDrawer()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold transition">
        Close
      </button>
    </div>
  </aside>

    let currentModule = "all";

    // --- RENDER MODULE FILTER TABS ---
    function renderTabs() {
      const container = document.getElementById("moduleTabs");
      container.innerHTML = modules.map(m => {
        const isActive = m.id === currentModule;
        return `
          <button onclick="selectModule('${m.id}')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150 border ${
              isActive 
                ? 'bg-slate-900 text-white border-slate-900 shadow-xs' 
                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100 hover:text-slate-900'
            }">
            ${m.name}
          </button>
        `;
      }).join('');
    }

    // --- RENDER DEADLINES LIST ---
    function renderDeadlines() {
      const listEl = document.getElementById("deadlineList");
      const titleEl = document.getElementById("sectionTitle");
      const counterEl = document.getElementById("counterBadge");

      const filtered = deadlines.filter(d => currentModule === "all" || d.moduleId === currentModule);

      const activeModuleName = modules.find(m => m.id === currentModule).name;
      titleEl.textContent = currentModule === "all" ? "All Upcoming Milestones" : `${activeModuleName} Deadlines`;
      counterEl.textContent = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-white p-6 rounded-xl border border-dashed border-slate-300 text-center text-slate-500 text-xs">No deadlines found for this module.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const isDated = item.dateISO !== null;
        const tagColor = item.type === "Formative" ? "bg-amber-50 text-amber-700 border-amber-200" : "bg-indigo-50 text-indigo-700 border-indigo-200";

        return `
          <div onclick="openDrawer('${item.id}')"
            class="group bg-white p-4 rounded-xl border border-slate-200 hover:border-slate-400 hover:shadow-xs transition duration-150 cursor-pointer flex items-center justify-between gap-4">
            
            <div class="space-y-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${tagColor}">${item.type}</span>
                <span class="text-xs font-medium text-slate-400 truncate">${item.moduleName}</span>
                <span class="text-xs font-medium text-slate-500">• ${item.weight}</span>
              </div>
              <h3 class="text-sm font-semibold text-slate-900 group-hover:text-indigo-600 transition truncate">${item.title}</h3>
              <p class="text-xs text-slate-500 truncate">${item.summary}</p>
            </div>

            <div class="text-right shrink-0">
              <p class="text-xs font-semibold ${isDated ? 'text-slate-900' : 'text-slate-400'}">${item.dateDisplay}</p>
              <span class="inline-flex items-center text-[11px] font-medium text-indigo-600 group-hover:underline mt-1">
                View details
                <svg class="w-3 h-3 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </span>
            </div>

          </div>
        `;
      }).join('');
    }

    // --- DRAWER ACTIONS ---
    function openDrawer(id) {
      const item = deadlines.find(d => d.id === id);
      if (!item) return;

      document.getElementById("drawerModule").textContent = item.moduleName;
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerDate").textContent = `Due Date: ${item.dateDisplay} (${item.weight})`;

      const badge = document.getElementById("drawerBadge");
      badge.textContent = item.type;
      badge.className = `text-xs font-semibold px-2 py-0.5 rounded border ${
        item.type === "Formative" ? "bg-amber-50 text-amber-700 border-amber-200" : "bg-indigo-50 text-indigo-700 border-indigo-200"
      }`;

      let bodyHTML = "";

      // Warning alert (if any)
      if (item.warning) {
        bodyHTML += `
          <div class="p-3.5 bg-red-50 border border-red-200 rounded-lg flex items-start gap-3">
            <svg class="w-4 h-4 text-red-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <div class="text-xs text-red-800 leading-relaxed font-medium">
              ${item.warning}
            </div>
          </div>
        `;
      }

      // Detailed sections
      item.details.forEach(sec => {
        bodyHTML += `
          <div class="space-y-2">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">${sec.section}</h4>
            <ul class="space-y-2">
              ${sec.items.map(bullet => `
                <li class="flex items-start gap-2.5 text-xs text-slate-600 leading-relaxed">
                  <span class="w-1.5 h-1.5 rounded-full bg-slate-400 mt-1.5 shrink-0"></span>
                  <span>${bullet}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      });

      document.getElementById("drawerBody").innerHTML = bodyHTML;

      // Show drawer & overlay
      document.getElementById("drawerOverlay").classList.remove("hidden");
      document.getElementById("detailDrawer").classList.remove("translate-x-full");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      document.getElementById("drawerOverlay").classList.add("hidden");
      document.getElementById("detailDrawer").classList.add("translate-x-full");
      document.body.style.overflow = "auto";
    }

    function selectModule(id) {
      currentModule = id;
      renderTabs();
      renderDeadlines();
    }

    // Keyboard support for drawer closing
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    // Initial render
    renderTabs();
    renderDeadlines();
  </script>
</body>
</html>
