<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Year Module Deadlines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
    .drawer-backdrop {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-150 flex flex-col">

  <header class="border-b border-slate-200/80 dark:border-slate-800/80 bg-white/90 dark:bg-slate-900/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-slate-900 dark:bg-white flex items-center justify-center text-white dark:text-slate-900">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
        </div>
        <h1 class="text-sm font-semibold tracking-tight text-slate-900 dark:text-white">Module Deadlines</h1>
      </div>

      <div class="flex items-center gap-2">
        <button id="addDateBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-100 text-white transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Set Date</span>
        </button>
        <button id="themeToggleBtn" title="Toggle theme" class="p-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- 1. Module Selection Pills -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
        <span class="font-medium uppercase tracking-wider text-[11px]">Select Module</span>
        <span id="filteredStats" class="text-[11px]"></span>
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="moduleTabsList">
        <button data-module="ALL" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-slate-900 text-white dark:bg-white dark:text-slate-900">
          All Modules
        </button>
        <button data-module="FYP" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800">
          Final Year Project <span class="text-[10px] text-blue-600 dark:text-blue-400 font-semibold">(Double Credit)</span>
        </button>
        <button data-module="CONCURRENT" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800">
          Concurrent
        </button>
        <button data-module="FORMAL" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800">
          Formal Methods
        </button>
        <button data-module="CYBER" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800">
          Cyber Security
        </button>
        <button data-module="OORO" class="module-tab px-3.5 py-1.5 text-xs font-medium rounded-full transition whitespace-nowrap bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800">
          OORO
        </button>
      </div>
    </div>

    <!-- 2. Brief Deadlines List -->
    <div class="space-y-3">
      <div class="flex items-center justify-between pb-1">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
          Upcoming Deadlines
        </h2>
        <span class="text-xs text-slate-400">Click item to view details</span>
      </div>

      <div id="deadlinesList" class="space-y-2">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <div id="drawerOverlay" class="fixed inset-0 z-50 drawer-backdrop opacity-0 pointer-events-none transition-opacity duration-200 flex justify-end">
    <div id="drawerPanel" class="w-full max-w-md bg-white dark:bg-slate-900 h-full shadow-xl flex flex-col transform translate-x-full transition-transform duration-200 ease-out border-l border-slate-200 dark:border-slate-800">
      
      <!-- Drawer Header -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-start justify-between gap-3">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span id="drawerModuleBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300"></span>
            <span id="drawerWeightBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300"></span>
          </div>
          <h3 id="drawerTitle" class="text-base font-bold text-slate-900 dark:text-white"></h3>
          <p id="drawerDate" class="text-xs text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1.5"></p>
        </div>

        <button id="closeDrawerBtn" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Drawer Body Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
        
        <!-- Mandatory Warning Box (if exists) -->
        <div id="drawerWarningBox" class="hidden p-3 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-800 dark:text-rose-200 space-y-1">
          <div class="flex items-center gap-1.5 font-semibold">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0"></i>
            <span>Important Assessment Rule</span>
          </div>
          <p id="drawerWarningText" class="leading-relaxed pl-5.5"></p>
        </div>

        <!-- Format & Purpose -->
        <div id="drawerFormatSection" class="hidden space-y-1 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-lg border border-slate-100 dark:border-slate-800">
          <span class="font-semibold text-slate-500 dark:text-slate-400 text-[10px] uppercase">Format / Purpose</span>
          <p id="drawerFormatText" class="text-slate-700 dark:text-slate-300 leading-relaxed"></p>
        </div>

        <!-- Deliverables / What Should We Do -->
        <div class="space-y-2">
          <h4 class="font-semibold uppercase text-slate-500 dark:text-slate-400 text-[11px] tracking-wide flex items-center gap-1.5">
            <i data-lucide="list-checks" class="w-3.5 h-3.5 text-blue-600"></i>
            What Should We Do / Content Required
          </h4>
          <ul id="drawerTasksList" class="space-y-1.5 text-slate-700 dark:text-slate-300">
            <!-- Injected via JS -->
          </ul>
        </div>
      </div>

      <!-- Drawer Footer -->
      <div class="p-3 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex justify-end">
        <button id="closeDrawerBtnBottom" class="px-3 py-1.5 text-xs font-medium bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-lg transition">
          Close
        </button>
      </div>

    </div>
  </div>

  <div id="setDateModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl max-w-sm w-full p-4 shadow-xl">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-white">Set / Update Date</h3>
        <button id="closeDateModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="dateForm" class="space-y-3 mt-3 text-xs">
        <div>
          <label class="block text-slate-600 dark:text-slate-400 mb-1">Select Item</label>
          <select id="dateTargetSelect" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
          </select>
        </div>

        <div>
          <label class="block text-slate-600 dark:text-slate-400 mb-1">Date & Time / Text</label>
          <input type="text" id="dateInputVal" placeholder="e.g. 15 Nov 2026 or 2026-11-15 14:00" required class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
          <button type="button" id="cancelDateModalBtn" class="px-3 py-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Cancel</button>
          <button type="submit" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 dark:bg-white dark:text-slate-900 text-white rounded-lg font-medium">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Modules list
    const MODULES = {

      CONCURRENT: { name: 'Concurrent', badge: '' },

        type: 'Coursework',
        weight: '',

        isoDate: '',
        formatText: 'Coursework assessment for OORO module.',
        tasks: ['Specific brief and submission date will appear here when announced.']
      },
      {
        id: 'ooro-ict',
        module: 'OORO',
        title: 'ICT Exam',
        type: 'ICT',
        weight: '',
        dateText: 'Date to be announced',
        isoDate: '',
        formatText: 'In-course timed assessment (ICT) for OORO.',
        tasks: ['Exam timetable to be confirmed by module leader.']
      }
    ];

    let deadlines = [];
    let selectedModule = 'ALL';

    function loadState() {
      const saved = localStorage.getItem('strict_uni_deadlines_v1');
      if (saved) {
        try {
          deadlines = JSON.parse(saved);
        } catch (e) {
          deadlines = JSON.parse(JSON.stringify(INITIAL_DEADLINES));
        }
      } else {
        deadlines = JSON.parse(JSON.stringify(INITIAL_DEADLINES));
      }
    }

    function saveState() {
      localStorage.setItem('strict_uni_deadlines_v1', JSON.stringify(deadlines));
      renderList();
    }

    function renderList() {
      const listEl = document.getElementById('deadlinesList');
      const statsEl = document.getElementById('filteredStats');
      listEl.innerHTML = '';

      const filtered = deadlines.filter(d => selectedModule === 'ALL' || d.module === selectedModule);
      statsEl.textContent = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      filtered.forEach(item => {
        const mod = MODULES[item.module];
        const card = document.createElement('div');
        const isFyp = item.module === 'FYP';
        const isTba = item.dateText.includes('announced');

        card.className = "p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl hover:border-slate-300 dark:hover:border-slate-700 transition cursor-pointer flex items-center justify-between gap-3";
        card.onclick = () => openDrawer(item.id);

        card.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">
                ${mod.name}
              </span>
              ${item.weight ? `<span class="text-[11px] text-blue-600 dark:text-blue-400 font-medium">${item.weight}</span>` : ''}
              ${item.type && !item.weight ? `<span class="text-[11px] text-slate-500 dark:text-slate-400">${item.type}</span>` : ''}
            </div>
            <div class="text-sm font-semibold text-slate-900 dark:text-white truncate">
              ${item.title}
            </div>
          </div>

          <div class="flex items-center gap-3 shrink-0">
            <div class="text-right">
              <span class="text-xs font-medium ${isTba ? 'text-slate-400 italic' : 'text-slate-700 dark:text-slate-200'}">
                ${item.dateText}
              </span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
          </div>
        `;
        listEl.appendChild(card);
      });

      lucide.createIcons();
    }

    function openDrawer(id) {
      const item = deadlines.find(d => d.id === id);
      if (!item) return;

      const mod = MODULES[item.module];
      document.getElementById('drawerModuleBadge').textContent = mod.name;
      
      const weightBadge = document.getElementById('drawerWeightBadge');
      if (item.weight) {
        weightBadge.textContent = item.weight;
        weightBadge.classList.remove('hidden');
      } else {
        weightBadge.textContent = item.type;
      }

      document.getElementById('drawerTitle').textContent = item.title;
      document.getElementById('drawerDate').innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5"></i> ${item.dateText}`;

      // Warning text
      const warningBox = document.getElementById('drawerWarningBox');
      const warningText = document.getElementById('drawerWarningText');
      if (item.warningText) {
        warningText.textContent = item.warningText;
        warningBox.classList.remove('hidden');
      } else {
        warningBox.classList.add('hidden');
      }

      // Format / purpose
      const formatSection = document.getElementById('drawerFormatSection');
      const formatText = document.getElementById('drawerFormatText');
      if (item.formatText) {
        formatText.textContent = item.formatText;
        formatSection.classList.remove('hidden');
      } else {
        formatSection.classList.add('hidden');
      }

      // Checklist / what to do
      const taskList = document.getElementById('drawerTasksList');
      taskList.innerHTML = '';
      (item.tasks || []).forEach(task => {
        const li = document.createElement('li');
        li.className = "flex items-start gap-2 py-1";
        li.innerHTML = `
          <span class="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0 mt-1.5"></span>
          <span class="leading-relaxed">${task}</span>
        `;
        taskList.appendChild(li);
      });

      // Show drawer
      const overlay = document.getElementById('drawerOverlay');
      const panel = document.getElementById('drawerPanel');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      panel.classList.remove('translate-x-full');
      lucide.createIcons();
    }

    function closeDrawer() {
      const overlay = document.getElementById('drawerOverlay');
      const panel = document.getElementById('drawerPanel');
      panel.classList.add('translate-x-full');
      overlay.classList.add('opacity-0', 'pointer-events-none');
    }

    document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
    document.getElementById('closeDrawerBtnBottom').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('drawerOverlay')) closeDrawer();
    });

    document.querySelectorAll('.module-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.module-tab').forEach(t => {
          t.classList.remove('bg-slate-900', 'text-white', 'dark:bg-white', 'dark:text-slate-900');
          t.classList.add('bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-800');
        });

        tab.classList.remove('bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-800');
        tab.classList.add('bg-slate-900', 'text-white', 'dark:bg-white', 'dark:text-slate-900');

        selectedModule = tab.getAttribute('data-module');
        renderList();
      });
    });

    const dateModal = document.getElementById('setDateModal');
    const dateSelect = document.getElementById('dateTargetSelect');

    document.getElementById('addDateBtn').addEventListener('click', () => {
      dateSelect.innerHTML = '';
      deadlines.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = `[${d.module}] ${d.title} (${d.dateText})`;
        dateSelect.appendChild(opt);
      });
      dateModal.classList.remove('hidden');
    });

    function closeDateModal() {
      dateModal.classList.add('hidden');
    }
    document.getElementById('closeDateModalBtn').addEventListener('click', closeDateModal);
    document.getElementById('cancelDateModalBtn').addEventListener('click', closeDateModal);

    document.getElementById('dateForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const targetId = dateSelect.value;
      const val = document.getElementById('dateInputVal').value.trim();
      if (!val) return;

      const target = deadlines.find(d => d.id === targetId);
      if (target) {
        target.dateText = val;
        saveState();
      }
      document.getElementById('dateInputVal').value = '';
      closeDateModal();
    });

    // Theme toggle
    function initTheme() {
      const isDark = localStorage.getItem('theme') === 'dark' || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadState();
      renderList();
    });
  </script>
</body>
</html>
